<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64" role="img" aria-labelledby="t d">
  <title id="t">Omoda / Jaecoo adapter</title>
  <desc id="d">A car beneath two signal arcs: a vehicle reporting its status over the air.</desc>
  <!--
    Original artwork for the adapter. It deliberately borrows nothing from
    Omoda, Jaecoo or Chery: their marks are trademarks and an adapter has no
    licence to ship them, and the ioBroker repository asks for the developer's
    own icon rather than the adapter-creator placeholder this replaces.

    What it says instead is what the adapter does: a car, and the signal it is
    answering on. Status, location, battery, lock and climate all arrive the
    same way, over the air, so the arcs are the subject as much as the car is.

    Self-grounded on a graphite plate, because the ioBroker admin renders
    adapter icons on both a light list and a dark one; a plate means one file
    reads on either without a second cut.
  -->
  <rect width="64" height="64" rx="13" fill="#18202B"/>

  <!-- The signal it answers on. Two arcs, not three: at 32 px a third merges into the second. -->
  <g fill="none" stroke="#31D07A" stroke-width="3.2" stroke-linecap="round">
    <path d="M19.5 17.5 Q32 6.5 44.5 17.5"/>
    <path d="M25.5 20.5 Q32 14.5 38.5 20.5"/>
  </g>

  <!-- The car: cabin, body, wheels. A side profile is the view that survives
       being 32 px wide; a plan or front view turns to mush. -->
  <path d="M20.5 36.5 L25 28.5 Q26 26.8 28 26.8 L38 26.8 Q40 26.8 41 28.5 L45.5 36.5 Z" fill="#F4F7FA"/>
  <rect x="11" y="35.5" width="42" height="9.5" rx="3.6" fill="#F4F7FA"/>
  <g fill="#F4F7FA">
    <circle cx="21" cy="47.5" r="4.6"/>
    <circle cx="43" cy="47.5" r="4.6"/>
  </g>
  <g fill="#18202B">
    <circle cx="21" cy="47.5" r="1.7"/>
    <circle cx="43" cy="47.5" r="1.7"/>
  </g>
</svg>
